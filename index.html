<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Elevation Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #FC4C02;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .strava-logo {
            width: 40px;
            height: 40px;
        }
        .auth-section {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .input-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2d3748;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #FC4C02;
        }
        button {
            background: #FC4C02;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #e03d00;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #FC4C02;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .chart-container {
            margin: 30px 0;
            position: relative;
            height: 400px;
            cursor: pointer;
        }
        .filters {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }
        .activity-list {
            margin-top: 30px;
        }
        .activity-item {
            background: #f7fafc;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .activity-info {
            flex: 1;
        }
        .activity-name {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 5px;
        }
        .activity-meta {
            font-size: 14px;
            color: #718096;
        }
        .activity-stats {
            text-align: right;
        }
        .elevation-rate {
            font-size: 24px;
            font-weight: bold;
            color: #FC4C02;
        }
        .elevation-label {
            font-size: 12px;
            color: #718096;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-button {
            background: #e2e8f0;
            color: #2d3748;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .close-button:hover {
            background: #cbd5e0;
        }
        .detail-chart-container {
            height: 500px;
            margin: 20px 0;
        }
        .clickable {
            cursor: pointer;
            transition: background 0.2s;
        }
        .clickable:hover {
            background: #edf2f7;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const StravaElevationTracker = () => {
            const [clientId, setClientId] = useState(sessionStorage.getItem('strava_client_id') || '200921');
            const [clientSecret, setClientSecret] = useState(sessionStorage.getItem('strava_client_secret') || '');
            const [accessToken, setAccessToken] = useState(null);
            const [activities, setActivities] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [athleteName, setAthleteName] = useState('');
            const [chart, setChart] = useState(null);
            const [activityType, setActivityType] = useState('all');
            const [timeRange, setTimeRange] = useState('all');
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [activityStreams, setActivityStreams] = useState(null);
            const [loadingStreams, setLoadingStreams] = useState(false);
            const [detailChart, setDetailChart] = useState(null);

            useEffect(() => {
                // Check for OAuth callback
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                
                if (code && clientSecret) {
                    exchangeToken(code);
                }
            }, [clientSecret]);

            };

            const handleAuth = () => {
                if (!clientId || !clientSecret) {
                    setError('Please enter both Client ID and Client Secret');
                    return;
                }

                // Store credentials temporarily
                sessionStorage.setItem('strava_client_id', clientId);
                sessionStorage.setItem('strava_client_secret', clientSecret);

                const redirectUri = 'https://edwardmonrad.github.io/vert-per-hour-strava-plugin';
                const scope = 'read,activity:read_all';
                const authUrl = `https://www.strava.com/oauth/authorize?client_id=${clientId}&response_type=code&redirect_uri=${redirectUri}&approval_prompt=force&scope=${scope}`;
                
                window.location.href = authUrl;
            };
            
            useEffect(() => {
                // Check for OAuth callback
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                
                if (code) {
                    const storedClientId = sessionStorage.getItem('strava_client_id');
                    const storedClientSecret = sessionStorage.getItem('strava_client_secret');
                    
                    if (storedClientId && storedClientSecret) {
                        exchangeToken(code, storedClientId, storedClientSecret);
                    }
                }
            }, []);

            const exchangeToken = async (code, clientIdParam, clientSecretParam) => {
                setLoading(true);
                setError(null);

                const useClientId = clientIdParam || clientId;
                const useClientSecret = clientSecretParam || clientSecret;

                try {
                    const response = await fetch('https://www.strava.com/oauth/token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            client_id: useClientId,
                            client_secret: useClientSecret,
                            code: code,
                            grant_type: 'authorization_code'
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || 'Failed to exchange token');
                    }

                    const data = await response.json();
                    setAccessToken(data.access_token);
                    setAthleteName(data.athlete.firstname + ' ' + data.athlete.lastname);
                    
                    // Clear credentials from storage after successful auth
                    sessionStorage.removeItem('strava_client_secret');
                    
                    // Clean up URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                    
                    // Fetch activities
                    await fetchActivities(data.access_token);
                } catch (err) {
                    setError('Authentication failed: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const fetchActivities = async (token) => {
                setLoading(true);
                setError(null);

                try {
                    let allActivities = [];
                    let page = 1;
                    const perPage = 200;

                    // Fetch all activities (paginated)
                    while (true) {
                        const response = await fetch(
                            `https://www.strava.com/api/v3/athlete/activities?page=${page}&per_page=${perPage}`,
                            {
                                headers: {
                                    'Authorization': `Bearer ${token}`
                                }
                            }
                        );

                        if (!response.ok) {
                            throw new Error('Failed to fetch activities');
                        }

                        const data = await response.json();
                        
                        if (data.length === 0) break;
                        
                        allActivities = [...allActivities, ...data];
                        page++;

                        // Safety limit
                        if (page > 10) break;
                    }

                    // Filter for runs and calculate elevation per hour
                    // Debug: log unique activity types
                    const uniqueTypes = [...new Set(allActivities.map(a => a.type))];
                    console.log('All activity types found:', uniqueTypes);
                    
                    const processedActivities = allActivities
                        .filter(activity => {
                            const isRun = activity.type === 'Run' || 
                                         activity.type === 'Trail' || 
                                         activity.type === 'TrailRun' ||
                                         activity.sport_type === 'TrailRun';
                            if (activity.type.includes('Run') || activity.type.includes('Trail')) {
                                console.log('Activity:', activity.name, 'Type:', activity.type, 'Sport:', activity.sport_type);
                            }
                            return isRun;
                        })
                        .map(activity => {
                            const hours = activity.moving_time / 3600;
                            const elevationGainPerHour = hours > 0 ? activity.total_elevation_gain / hours : 0;
                            
                            return {
                                id: activity.id,
                                name: activity.name,
                                date: new Date(activity.start_date),
                                distance: (activity.distance / 1000).toFixed(2), // km
                                elevationGain: activity.total_elevation_gain,
                                movingTime: activity.moving_time,
                                hours: hours.toFixed(2),
                                elevationPerHour: elevationGainPerHour.toFixed(0),
                                type: activity.type,
                                sportType: activity.sport_type
                            };
                        })
                        .sort((a, b) => b.date - a.date);

                    setActivities(processedActivities);
                    createChart(processedActivities);
                } catch (err) {
                    setError('Failed to fetch activities: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const createChart = (data) => {
                // Destroy existing chart
                if (chart) {
                    chart.destroy();
                }

                const ctx = document.getElementById('elevationChart');
                if (!ctx) return;

                const filteredData = filterActivities(data);

                const newChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: filteredData.map(a => a.date.toLocaleDateString()),
                        datasets: [{
                            label: 'Elevation Gain (m/hr)',
                            data: filteredData.map(a => parseFloat(a.elevationPerHour)),
                            backgroundColor: 'rgba(252, 76, 2, 0.6)',
                            borderColor: 'rgba(252, 76, 2, 1)',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        onClick: (event, activeElements) => {
                            if (activeElements.length > 0) {
                                const index = activeElements[0].index;
                                const activity = filteredData[index];
                                handleActivityClick(activity);
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            tooltip: {
                                callbacks: {
                                    afterLabel: function(context) {
                                        const activity = filteredData[context.dataIndex];
                                        return [
                                            `Total Elevation: ${activity.elevationGain}m`,
                                            `Duration: ${activity.hours}hrs`,
                                            `Distance: ${activity.distance}km`,
                                            '',
                                            'Click to see details'
                                        ];
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Elevation Gain (meters/hour)'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Date'
                                }
                            }
                        }
                    }
                });

                setChart(newChart);
            };

            const filterActivities = (data) => {
                let filtered = [...data];

                // Filter by activity type
                if (activityType !== 'all') {
                    filtered = filtered.filter(a => {
                        // Check both type and sportType fields
                        if (activityType === 'Trail') {
                            return a.type === 'Trail' || 
                                   a.type === 'TrailRun' || 
                                   a.sportType === 'TrailRun';
                        }
                        return a.type === activityType;
                    });
                }

                // Filter by time range
                const now = new Date();
                if (timeRange === '30days') {
                    const cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                    filtered = filtered.filter(a => a.date >= cutoff);
                } else if (timeRange === '90days') {
                    const cutoff = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
                    filtered = filtered.filter(a => a.date >= cutoff);
                } else if (timeRange === 'year') {
                    const cutoff = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
                    filtered = filtered.filter(a => a.date >= cutoff);
                }

                return filtered;
            };

            const fetchActivityStreams = async (activityId) => {
                setLoadingStreams(true);
                setError(null);

                try {
                    // Fetch time, altitude, and distance streams
                    const response = await fetch(
                        `https://www.strava.com/api/v3/activities/${activityId}/streams?keys=time,altitude,distance&key_by_type=true`,
                        {
                            headers: {
                                'Authorization': `Bearer ${accessToken}`
                            }
                        }
                    );

                    if (!response.ok) {
                        throw new Error('Failed to fetch activity streams');
                    }

                    const data = await response.json();
                    
                    console.log('Received streams data:', Object.keys(data));
                    
                    // Calculate climb and descent rates
                    if (data.altitude && data.time && data.distance) {
                        console.log('Processing', data.altitude.data.length, 'altitude points');
                        const streams = processStreams(data);
                        console.log('Processed into', streams.length, 'rate points');
                        setActivityStreams(streams);
                        createDetailChart(streams);
                    } else {
                        console.error('Missing data:', {
                            hasAltitude: !!data.altitude,
                            hasTime: !!data.time,
                            hasDistance: !!data.distance
                        });
                        setError('This activity does not have elevation data');
                    }
                } catch (err) {
                    setError('Failed to fetch activity details: ' + err.message);
                } finally {
                    setLoadingStreams(false);
                }
            };

            const processStreams = (data) => {
                const altitude = data.altitude.data;
                const time = data.time.data;
                const distance = data.distance.data;

                // Calculate rates over 1-minute windows (60 seconds)
                const windowSize = 60;
                const rates = [];

                for (let i = 0; i < time.length; i++) {
                    // Find points within the window
                    const windowStart = time[i];
                    const windowEnd = windowStart + windowSize;
                    
                    let windowEndIdx = i;
                    while (windowEndIdx < time.length && time[windowEndIdx] < windowEnd) {
                        windowEndIdx++;
                    }
                    
                    if (windowEndIdx > i) {
                        const elevChange = altitude[windowEndIdx - 1] - altitude[i];
                        const timeElapsed = (time[windowEndIdx - 1] - time[i]) / 3600; // hours
                        
                        const ratePerHour = timeElapsed > 0 ? elevChange / timeElapsed : 0;
                        const climbRate = ratePerHour > 0 ? ratePerHour : 0;
                        const descentRate = ratePerHour < 0 ? Math.abs(ratePerHour) : 0;
                        
                        rates.push({
                            time: time[i] / 60, // minutes
                            distance: distance[i] / 1000, // km
                            altitude: altitude[i],
                            climbRate: climbRate,
                            descentRate: descentRate
                        });
                    }
                }

                return rates;
            };

            const createDetailChart = (streams) => {
                // Wait for next tick to ensure canvas is rendered
                setTimeout(() => {
                    // Destroy existing detail chart
                    if (detailChart) {
                        detailChart.destroy();
                    }

                    const ctx = document.getElementById('detailChart');
                    if (!ctx) {
                        console.error('Detail chart canvas not found');
                        return;
                    }
                    
                    console.log('Creating detail chart with', streams.length, 'data points');

                    // Sample the data if too many points (show every Nth point)
                    const maxPoints = 100;
                    const step = Math.max(1, Math.floor(streams.length / maxPoints));
                    const sampledData = streams.filter((_, idx) => idx % step === 0);
                    
                    console.log('Sampled to', sampledData.length, 'points');

                    const newChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: sampledData.map(s => s.time.toFixed(1)),
                            datasets: [
                                {
                                    label: 'Climb Rate (m/hr)',
                                    data: sampledData.map(s => s.climbRate),
                                    borderColor: 'rgba(252, 76, 2, 1)',
                                    backgroundColor: 'rgba(252, 76, 2, 0.1)',
                                    borderWidth: 2,
                                    fill: true,
                                    yAxisID: 'y'
                                },
                                {
                                    label: 'Descent Rate (m/hr)',
                                    data: sampledData.map(s => s.descentRate),
                                    borderColor: 'rgba(59, 130, 246, 1)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    borderWidth: 2,
                                    fill: true,
                                    yAxisID: 'y'
                                },
                            {
                                label: 'Elevation (m)',
                                data: sampledData.map(s => s.altitude),
                                borderColor: 'rgba(34, 197, 94, 1)',
                                backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            tooltip: {
                                callbacks: {
                                    title: function(context) {
                                        const idx = context[0].dataIndex * step;
                                        if (idx < streams.length) {
                                            return `Time: ${streams[idx].time.toFixed(1)} min | Distance: ${streams[idx].distance.toFixed(2)} km`;
                                        }
                                        return '';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Time (minutes)'
                                }
                            },
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'Climb/Descent Rate (m/hr)'
                                }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Elevation (m)'
                                },
                                grid: {
                                    drawOnChartArea: false,
                                }
                            }
                        }
                    }
                });

                setDetailChart(newChart);
                }, 100); // Wait 100ms for DOM to render
            };

            const handleActivityClick = (activity) => {
                setSelectedActivity(activity);
                fetchActivityStreams(activity.id);
            };

            const closeDetailView = () => {
                setSelectedActivity(null);
                setActivityStreams(null);
                if (detailChart) {
                    detailChart.destroy();
                    setDetailChart(null);
                }
            };

            useEffect(() => {
                if (activities.length > 0) {
                    createChart(activities);
                }
            }, [activityType, timeRange]);

            const calculateStats = () => {
                const filtered = filterActivities(activities);
                
                if (filtered.length === 0) {
                    return { total: 0, average: 0, max: 0, totalRuns: 0 };
                }

                const elevationRates = filtered.map(a => parseFloat(a.elevationPerHour));
                const total = filtered.reduce((sum, a) => sum + parseFloat(a.elevationGain), 0);
                const average = elevationRates.reduce((sum, rate) => sum + rate, 0) / elevationRates.length;
                const max = Math.max(...elevationRates);

                return {
                    total: Math.round(total),
                    average: Math.round(average),
                    max: Math.round(max),
                    totalRuns: filtered.length
                };
            };

            const stats = calculateStats();

            if (!accessToken) {
                return (
                    <div className="container">
                        <h1>
                            <svg className="strava-logo" viewBox="0 0 24 24" fill="#FC4C02">
                                <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7.008 13.828h4.172"/>
                            </svg>
                            Strava Elevation Tracker
                        </h1>
                        
                        <div className="auth-section">
                            <h2>Connect to Strava</h2>
                            <p>Analyze your trail running elevation data from Strava.</p>
                            
                            <div className="input-group">
                                <label>Client ID</label>
                                <input 
                                    type="text" 
                                    value={clientId}
                                    onChange={(e) => setClientId(e.target.value)}
                                    placeholder="Your Strava Client ID"
                                />
                            </div>
                            
                            <div className="input-group">
                                <label>Client Secret</label>
                                <input 
                                    type="password" 
                                    value={clientSecret}
                                    onChange={(e) => setClientSecret(e.target.value)}
                                    placeholder="Your Strava Client Secret"
                                />
                            </div>
                            
                            {error && <div className="error">{error}</div>}
                            
                            <button onClick={handleAuth} disabled={!clientId || !clientSecret}>
                                Connect with Strava
                            </button>
                            
                            <p style={{marginTop: '20px', fontSize: '14px', color: '#718096'}}>
                                <strong>Note:</strong> Your credentials are only used to authenticate with Strava and are never stored or sent anywhere else.
                            </p>
                        </div>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="container">
                        <div className="loading">
                            <div className="spinner"></div>
                            <p>Loading your activities...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <h1>
                        <svg className="strava-logo" viewBox="0 0 24 24" fill="#FC4C02">
                            <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7.008 13.828h4.172"/>
                        </svg>
                        {athleteName}'s Elevation Analysis
                    </h1>

                    {error && <div className="error">{error}</div>}

                    <div className="filters">
                        <div className="filter-group">
                            <label>Activity Type</label>
                            <select value={activityType} onChange={(e) => setActivityType(e.target.value)}>
                                <option value="all">All Runs</option>
                                <option value="Run">Road Runs</option>
                                <option value="Trail">Trail Runs</option>
                            </select>
                        </div>
                        <div className="filter-group">
                            <label>Time Range</label>
                            <select value={timeRange} onChange={(e) => setTimeRange(e.target.value)}>
                                <option value="all">All Time</option>
                                <option value="30days">Last 30 Days</option>
                                <option value="90days">Last 90 Days</option>
                                <option value="year">Last Year</option>
                            </select>
                        </div>
                    </div>

                    <div className="stats">
                        <div className="stat-card">
                            <div className="stat-label">Total Runs</div>
                            <div className="stat-value">{stats.totalRuns}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Avg Elevation/Hour</div>
                            <div className="stat-value">{stats.average}m</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Max Elevation/Hour</div>
                            <div className="stat-value">{stats.max}m</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Total Elevation</div>
                            <div className="stat-value">{stats.total.toLocaleString()}m</div>
                        </div>
                    </div>

                    <div className="chart-container">
                        <p style={{fontSize: '14px', color: '#718096', marginBottom: '10px', textAlign: 'center'}}>
                            Click on any bar to see detailed climb/descent rates for that activity
                        </p>
                        <canvas id="elevationChart"></canvas>
                    </div>

                    <div className="activity-list">
                        <h2>Recent Activities</h2>
                        <p style={{fontSize: '14px', color: '#718096', marginBottom: '15px'}}>
                            Click on any activity to see detailed climb/descent rates over time
                        </p>
                        {filterActivities(activities).slice(0, 10).map(activity => (
                            <div 
                                key={activity.id} 
                                className="activity-item clickable"
                                onClick={() => handleActivityClick(activity)}
                            >
                                <div className="activity-info">
                                    <div className="activity-name">{activity.name}</div>
                                    <div className="activity-meta">
                                        {activity.date.toLocaleDateString()} • {activity.distance} km • {activity.hours} hrs • {activity.elevationGain}m gain
                                    </div>
                                </div>
                                <div className="activity-stats">
                                    <div className="elevation-rate">{activity.elevationPerHour}</div>
                                    <div className="elevation-label">m/hr</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {selectedActivity && (
                        <div className="modal-overlay" onClick={closeDetailView}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2>{selectedActivity.name}</h2>
                                    <button className="close-button" onClick={closeDetailView}>Close</button>
                                </div>
                                
                                <div style={{marginBottom: '20px'}}>
                                    <div className="activity-meta">
                                        {selectedActivity.date.toLocaleDateString()} • {selectedActivity.distance} km • {selectedActivity.hours} hrs • {selectedActivity.elevationGain}m total gain
                                    </div>
                                </div>

                                {loadingStreams && (
                                    <div className="loading">
                                        <div className="spinner"></div>
                                        <p>Loading activity details...</p>
                                    </div>
                                )}

                                {!loadingStreams && activityStreams && (
                                    <>
                                        <h3>Climb & Descent Rates Over Time</h3>
                                        <p style={{fontSize: '14px', color: '#718096', marginBottom: '15px'}}>
                                            Rates calculated using 1-minute rolling windows
                                        </p>
                                        <div className="detail-chart-container">
                                            <canvas id="detailChart"></canvas>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<StravaElevationTracker />, document.getElementById('root'));
    </script>
</body>
</html>
